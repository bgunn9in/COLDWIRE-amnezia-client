name: Test the Apple Silicon package
on:
  push:
    branches: [test/macos-arm64-egress]
permissions:
  contents: read
jobs:
  macos:
    name: macOS Apple Silicon
    runs-on: macos-26
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3.0'

      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.10.1'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtremoteobjects qt5compat qtshadertools qthttpserver qtwebsockets
          dir: ${{ runner.temp }}
          aqtversion: '==3.3.0'
          set-env: true

      - name: Test SPA profile handling
        run: |
          cmake -S client/tests/spa -B spa-check -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build spa-check
          ctest --test-dir spa-check --output-on-failure

      - name: Build the standalone macOS package
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
        run: |
          python -m pip install 'conan==2.28.0'
          deploy/build.sh -t macos --generator Ninja --installer productbuild

      - name: Verify the ARM64 package
        run: |
          test "$(uname -m)" = arm64
          shopt -s nullglob
          packages=(deploy/build/*_macos_arm64.pkg)
          test "${#packages[@]}" -eq 1
          expanded="$RUNNER_TEMP/coldwire-package"
          pkgutil --expand-full "${packages[0]}" "$expanded"
          test "$(xmllint --xpath 'string(/installer-gui-script/options/@hostArchitectures)' "$expanded/Distribution")" = arm64
          app=$(find "$expanded" -type d -name AmneziaVPN.app -print -quit)
          test -n "$app"
          for binary in AmneziaVPN AmneziaVPN-service amneziawg-go; do
            test "$(lipo -archs "$app/Contents/MacOS/$binary")" = arm64
          done
          for resource in geoip.dat geosite.dat pf update-resolv-conf.sh; do
            test "$(readlink "$app/Contents/MacOS/$resource")" = "../Resources/$resource"
            test -e "$app/Contents/Resources/$resource"
          done
          codesign --verify --deep --strict --all-architectures --verbose=2 "$app"
          codesign --verify --strict --all-architectures "$app/Contents/PlugIns/platforms/libqcocoa.dylib"
          QT_QPA_PLATFORM=cocoa "$app/Contents/MacOS/AmneziaVPN" --version

      - uses: actions/upload-artifact@v4
        with:
          name: coldwire-macos-unsigned
          path: deploy/build/*_macos_arm64.pkg
          if-no-files-found: error
          retention-days: 7

      - name: Install and start the packaged client
        run: |
          if ! sudo /usr/sbin/installer -dumplog -verboseR -pkg deploy/build/*_macos_arm64.pkg -target /; then
            sudo tail -n 75 /var/log/install.log || true
            sudo tail -n 60 /var/log/AmneziaVPN/post-install.log || true
            exit 1
          fi
          sudo launchctl print system/AmneziaVPN-service | grep 'state = running'
          open -a /Applications/AmneziaVPN.app
          sleep 5
          pgrep -x AmneziaVPN

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: bgunn9in/coldwire
          ref: 57d7517401ae246e89e7e9e8ed2ff17fdcabcf2e
          path: admin-panel
          persist-credentials: false

      - name: Verify split tunneling with the installed client
        timeout-minutes: 25
        run: |
          set -o pipefail
          bash client/tests/macos/run_relay_routes.sh 2>&1 | tee "$RUNNER_TEMP/coldwire-macos-egress.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coldwire-macos-egress
          path: ${{ runner.temp }}/coldwire-macos-egress.log
          if-no-files-found: ignore
          retention-days: 7
