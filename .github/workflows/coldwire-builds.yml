name: COLDWIRE builds and releases

on:
  push:
    branches: [feature/spa-admission]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      existing_run:
        description: Successful COLDWIRE build run to publish
        type: string
        required: false
      windows_only:
        description: Build a Windows MSI for manual verification
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: coldwire-builds-${{ inputs.existing_run || github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    if: ${{ !inputs.existing_run && !inputs.windows_only }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3.0'

      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.10.1'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtremoteobjects qt5compat qtshadertools qthttpserver qtwebsockets
          dir: ${{ runner.temp }}
          aqtversion: '==3.3.0'
          set-env: true

      - name: Test SPA profile handling
        run: |
          cmake -S client/tests/spa -B spa-check -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build spa-check
          ctest --test-dir spa-check --output-on-failure

      - name: Build the standalone macOS package
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
        run: |
          python -m pip install 'conan==2.28.0'
          deploy/build.sh -t macos --generator Ninja --installer productbuild

      - name: Verify signatures and start the packaged client
        run: |
          shopt -s nullglob
          packages=(deploy/build/*.pkg)
          test "${#packages[@]}" -eq 1
          expanded="$RUNNER_TEMP/coldwire-package"
          pkgutil --expand-full "${packages[0]}" "$expanded"
          app=$(find "$expanded" -type d -name AmneziaVPN.app -print -quit)
          test -n "$app"
          codesign --verify --deep --strict --all-architectures --verbose=2 "$app"
          codesign --verify --strict --all-architectures "$app/Contents/PlugIns/platforms/libqcocoa.dylib"
          QT_QPA_PLATFORM=cocoa "$app/Contents/MacOS/AmneziaVPN" --version

      - uses: actions/upload-artifact@v4
        with:
          name: coldwire-macos-unsigned
          path: deploy/build/*.pkg
          if-no-files-found: error
          retention-days: 7

  android:
    if: ${{ !inputs.existing_run && !inputs.windows_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_PLATFORM: android-28
      ANDROID_NDK_VERSION: 27.0.11718014
      APP_ANDROID_MIN_SDK: '28'
      APP_ANDROID_MAX_SDK: '29'
      APP_ANDROID_VERSION_CODE_OFFSET: ${{ github.run_number }}
      ORG_GRADLE_PROJECT_coldwireTestApp: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-28 platforms;android-36 build-tools;36.0.0 ndk;27.0.11718014

      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.10.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtremoteobjects qt5compat qtimageformats qtshadertools
          dir: ${{ runner.temp }}
          aqtversion: '==3.3.0'

      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.10.1'
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: qtremoteobjects qt5compat qtimageformats qtshadertools
          dir: ${{ runner.temp }}
          aqtversion: '==3.3.0'
          set-env: false

      - name: Build and verify the Android 9/10 APK
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
          QT_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/coldwire-android.p12
          QT_ANDROID_KEYSTORE_ALIAS: coldwire-android
          QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.COLDWIRE_ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.COLDWIRE_ANDROID_KEYSTORE }}
        run: |
          umask 077
          python -m pip install 'conan==2.28.0'
          test -n "$KEYSTORE_BASE64"
          test -n "$QT_ANDROID_KEYSTORE_STORE_PASS"
          trap 'rm -f -- "$QT_ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$QT_ANDROID_KEYSTORE_PATH"
          unset KEYSTORE_BASE64
          sed -i 's/-- %%INSERT_APP_NAME%% --/COLDWIRE/' client/android/AndroidManifest.xml
          deploy/build.sh -t android --abi arm64-v8a --sign
          apk_dir=deploy/build/client/android-build/build/outputs/apk/oss/release
          mapfile -t apks < <(find "$apk_dir" -maxdepth 1 -name '*.apk' -type f)
          test "${#apks[@]}" -eq 1
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --print-certs "${apks[0]}"
          "$tools/aapt" dump badging "${apks[0]}" > android-badging.txt
          grep -F "package: name='org.amnezia.vpn.coldwire'" android-badging.txt
          grep -F "sdkVersion:'28'" android-badging.txt
          grep -F "native-code: 'arm64-v8a'" android-badging.txt
          "$tools/aapt" dump xmltree "${apks[0]}" AndroidManifest.xml > android-manifest.txt
          grep -E 'android:maxSdkVersion.*0x1d' android-manifest.txt
          mkdir -p artifacts
          cp "${apks[0]}" artifacts/COLDWIRE_5.1.1.10_android9-10_arm64-v8a_test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: coldwire-android9-10-arm64-test
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 7

  windows:
    if: ${{ !inputs.existing_run }}
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.10.1'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtremoteobjects qt5compat qtshadertools qthttpserver qtwebsockets
          dir: ${{ runner.temp }}
          aqtversion: '==3.3.0'

      - name: Test SPA profile handling
        run: |
          cmake -S client/tests/spa -B spa-check -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build spa-check
          ctest --test-dir spa-check --output-on-failure

      - name: Build the Windows MSI
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install 'conan==2.28.0'
          dotnet tool install --global wix --version 4.0.6
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix extension add -g WixToolset.UI.wixext/4.0.6
          wix extension add -g WixToolset.Util.wixext/4.0.6
          cmake -S . -B win-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build win-build --parallel
          $app = [IO.File]::ReadAllBytes((Resolve-Path 'win-build/client/AmneziaVPN.exe').Path)
          $peHeader = [BitConverter]::ToInt32($app, 0x3c)
          if ([BitConverter]::ToUInt16($app, $peHeader + 24 + 68) -ne 2) {
            throw 'AmneziaVPN.exe must use the Windows GUI subsystem'
          }
          cpack -G WIX --config win-build/CPackConfig.cmake -B artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: coldwire-windows-x64-unsigned
          path: artifacts/*.msi
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [windows, macos, android]
    if: >-
      ${{ !cancelled() && !inputs.windows_only && github.ref == 'refs/heads/feature/spa-admission' &&
          (inputs.existing_run || (needs.windows.result == 'success' &&
          needs.macos.result == 'success' && needs.android.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Resolve build artifacts
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.existing_run }}
        run: |
          run_id="$GITHUB_RUN_ID"
          commit="$GITHUB_SHA"
          if [[ -n "$SOURCE_RUN" ]]; then
            [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
            workflow=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/coldwire-builds.yml" --jq .id)
            commit=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" |
              jq -er --argjson workflow "$workflow" '
                select(.workflow_id == $workflow and .head_branch == "feature/spa-admission" and .conclusion == "success") | .head_sha')
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$commit...$GITHUB_SHA" --jq .status)
            [[ "$status" == ahead || "$status" == identical ]]
            run_id="$SOURCE_RUN"
          fi
          printf 'run_id=%s\ncommit=%s\n' "$run_id" "$commit" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          pattern: 'coldwire-*'
          path: installers

      - uses: android-actions/setup-android@v4
        if: inputs.existing_run
        with:
          packages: build-tools;36.0.0

      - name: Sign the existing Android APK with the release key
        if: inputs.existing_run
        env:
          KEYSTORE_BASE64: ${{ secrets.COLDWIRE_ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.COLDWIRE_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          shopt -s nullglob
          apks=(installers/coldwire-android9-10-arm64-test/*.apk)
          test "${#apks[@]}" -eq 1
          keystore="$RUNNER_TEMP/coldwire-android.p12"
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          unset KEYSTORE_BASE64
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$signer" sign --ks "$keystore" --ks-key-alias coldwire-android \
            --ks-pass env:KEYSTORE_PASSWORD --out "$RUNNER_TEMP/coldwire.apk" "${apks[0]}"
          "$signer" verify --print-certs "$RUNNER_TEMP/coldwire.apk"
          mv "$RUNNER_TEMP/coldwire.apk" "${apks[0]}"

      - name: Publish all three installers
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ steps.source.outputs.run_id }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          shopt -s nullglob
          msi=(installers/coldwire-windows-x64-unsigned/*.msi)
          pkg=(installers/coldwire-macos-unsigned/*.pkg)
          apk=(installers/coldwire-android9-10-arm64-test/*.apk)
          test "${#msi[@]}:${#pkg[@]}:${#apk[@]}" = '1:1:1'
          mkdir dist
          mv "${msi[0]}" dist/COLDWIRE-Windows-x64.msi
          mv "${pkg[0]}" dist/COLDWIRE-macOS.pkg
          mv "${apk[0]}" dist/COLDWIRE-Android-9-10-arm64-v8a.apk
          cd dist
          files=(COLDWIRE-Windows-x64.msi COLDWIRE-macOS.pkg COLDWIRE-Android-9-10-arm64-v8a.apk)
          for file in "${files[@]}"; do test -s "$file"; done
          sha256sum "${files[@]}" > SHA256SUMS.txt

          tag="coldwire-spa-${SOURCE_COMMIT:0:12}"
          latest=true
          if [[ "$SOURCE_RUN" != "$GITHUB_RUN_ID" ]] && gh release view -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            latest=false
          fi
          if release=$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft,targetCommitish); then
            test "$(jq -r .targetCommitish <<< "$release")" = "$SOURCE_COMMIT"
            if [[ $(jq -r .isDraft <<< "$release") == false ]]; then
              gh release view "$tag" -R "$GITHUB_REPOSITORY" --json url --jq .url
              exit 0
            fi
          else
            cat > notes.md <<EOF
          Installers for testing SPA admission with AmneziaWG on Windows x64, macOS (Intel and Apple Silicon), and Android 9/10 ARM64.

          The MSI and PKG are unsigned. The Android APK uses the COLDWIRE release key. Older CI APKs used a different key and need a fresh install.

          Source commit: \`$SOURCE_COMMIT\`

          [Build and verification logs](https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN)
          EOF
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" \
              --draft --title "COLDWIRE SPA ${SOURCE_COMMIT:0:12}" --notes-file notes.md
          fi
          gh release upload "$tag" "${files[@]}" SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" -R "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
