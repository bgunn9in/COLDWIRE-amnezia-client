name: Verify the built ARM64 package on macOS 26

on:
  push:
    branches: [test/macos-arm64-replay]

permissions:
  actions: read
  contents: read

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: coldwire-macos-unsigned-macos-15
          run-id: 45687306192
          path: installer
          github-token: ${{ github.token }}

      - name: Install and start COLDWIRE on Apple Silicon
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -m)" = arm64
          sw_vers
          package=(installer/*_macos_arm64.pkg)
          test "${#package[@]}" -eq 1
          printf '%s  %s\n' 386936ba224d7ce2574021e63d0d1df0a96a2032756125365533361504a325f4 "${package[0]}" | shasum -a 256 -c -
          if ! sudo /usr/sbin/installer -dumplog -verboseR -pkg "${package[0]}" -target /; then
            sudo tail -n 75 /var/log/install.log || true
            sudo tail -n 60 /var/log/AmneziaVPN/post-install.log || true
            exit 1
          fi
          sudo launchctl print system/AmneziaVPN-service | grep 'state = running'
          open -a /Applications/AmneziaVPN.app
          sleep 5
          pgrep -x AmneziaVPN

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: bgunn9in/coldwire
          ref: 57d7517401ae246e89e7e9e8ed2ff17fdcabcf2e
          path: admin-panel
          persist-credentials: false

      - name: Verify the observed provider and exit IPv4 addresses
        timeout-minutes: 24
        run: |
          set -o pipefail
          bash client/tests/macos/run_relay_routes.sh 2>&1 | tee "$RUNNER_TEMP/coldwire-macos-egress.log"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: coldwire-macos-egress-macos-26
          path: ${{ runner.temp }}/coldwire-macos-egress.log
          if-no-files-found: ignore
          retention-days: 7
